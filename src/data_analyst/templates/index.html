{% extends "base.html" %}
{% block content %}

<!-- Upload -->
<div class="card">
  <h2>1. Upload a CSV file</h2>
  <label for="csv-file">Select file (.csv only)</label>
  <input type="file" id="csv-file" accept=".csv">
  <button id="upload-btn" onclick="uploadFile()">Upload</button>
  <div id="upload-status"></div>
  <div id="dataset-info" class="dataset-info"></div>
</div>

<!-- Two-column layout: main left, sessions right -->
<div id="workspace" style="display:flex; gap:16px; align-items:flex-start;">

  <!-- LEFT: Ask + conversation -->
  <div style="flex:1; min-width:0;">
    <div class="card" style="margin-bottom:0;">
      <h2>2. Ask a question</h2>
      <label for="dataset-select">Dataset</label>
      <select id="dataset-select" onchange="onDatasetChange()">
        <option value="">— select a dataset —</option>
        {% for ds in datasets %}
        <option value="{{ ds.dataset_id }}">{{ ds.filename }} ({{ ds.row_count }} rows)</option>
        {% endfor %}
      </select>

      <!-- Conversation thread -->
      <div id="conversation" style="display:none; margin-top:16px; margin-bottom:16px;">
        <div style="font-size:12px; font-weight:600; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;">Conversation</div>
        <div id="thread"></div>
      </div>

      <label for="question">Your question</label>
      <textarea id="question" placeholder="e.g. What is the average rating by year?"></textarea>
      <button id="ask-btn" onclick="askQuestion()">Ask</button>
      <div id="ask-status"></div>
    </div>
  </div>

  <!-- RIGHT: Sessions sidebar -->
  <div id="session-sidebar" style="display:none; width:280px; flex-shrink:0;">
    <div class="card" style="margin-bottom:0; padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span style="font-size:12px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em;">Sessions</span>
        <button onclick="startNewSession()" style="background:#1e40af; font-size:12px; padding:4px 10px;">+ New</button>
      </div>
      <div id="session-list"></div>
    </div>
  </div>

</div>

<style>
  /* session list */
  .session-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid #e5e7eb;
    margin-bottom: 6px;
    background: #fff;
    transition: background .12s, border-color .12s;
  }
  .session-item:hover  { background: #eff6ff; border-color: #bfdbfe; }
  .session-item.active { background: #eff6ff; border-left: 3px solid #3b82f6; border-color: #3b82f6; }
  .session-label { font-size: 13px; color: #1f2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .session-meta  { font-size: 11px; color: #9ca3af; margin-top: 2px; display: block; }
  .session-empty { font-size: 13px; color: #9ca3af; padding: 4px 0; font-style: italic; }

  /* conversation turns */
  .turn {
    border-left: 3px solid #bfdbfe;
    padding: 10px 14px;
    margin-bottom: 12px;
    background: #f8fafc;
    border-radius: 0 6px 6px 0;
  }
  .turn.failed { border-left-color: #fca5a5; background: #fff7f7; }
  .turn-q { font-size: 13px; color: #1e40af; font-weight: 600; margin-bottom: 6px; }
  .answer-body { font-size: 14px; line-height: 1.65; color: #1f2937; }
  .answer-body p  { margin: 0 0 8px; }
  .answer-body ul,
  .answer-body ol { margin: 0 0 8px; padding-left: 20px; }
  .answer-body li { margin-bottom: 3px; }
  .answer-body table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    display: block;
    overflow-x: auto;
    max-width: 100%;
  }
  .answer-body th,
  .answer-body td { border: 1px solid #d1d5db; padding: 5px 10px; text-align: left; white-space: nowrap; }
  .answer-body th { background: #eff6ff; font-weight: 600; color: #1e3a5f; }
  .answer-body strong { color: #1e3a5f; }
  .answer-body code { background: #f3f4f6; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .answer-body pre  { background: #f3f4f6; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  .answer-body em   { color: #6b7280; }
  .turn-meta { font-size: 11px; color: #9ca3af; margin-top: 6px; }
</style>

<script>
  let currentSessionId = null;
  let currentDatasetId = null;

  function escHtml(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function relTime(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr)) / 1000);
    if (diff < 60)    return "just now";
    if (diff < 3600)  return `${Math.floor(diff/60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
    return `${Math.floor(diff/86400)}d ago`;
  }

  // ── session list ─────────────────────────────────────────────────────────────

  async function loadSessionList() {
    if (!currentDatasetId) return;
    const list = document.getElementById("session-list");
    const sidebar = document.getElementById("session-sidebar");
    try {
      const resp = await fetch(`/datasets/${currentDatasetId}/sessions`);
      const body = await resp.json();
      if (!resp.ok) return;
      const sessions = body.data;
      sidebar.style.display = sessions.length ? "block" : "none";
      if (!sessions.length) { list.innerHTML = ""; return; }
      list.innerHTML = sessions.map(s => `
        <div class="session-item${s.session_id === currentSessionId ? " active" : ""}"
             data-sid="${s.session_id}"
             onclick="resumeSession('${s.session_id}')">
          <span class="session-label">${escHtml((s.first_question || "Untitled").slice(0, 55))}</span>
          <span class="session-meta">${s.turn_count} turn${s.turn_count !== 1 ? "s" : ""} &middot; ${relTime(s.updated_at)}</span>
        </div>`).join("");
    } catch { /* non-critical */ }
  }

  async function resumeSession(sessionId) {
    currentSessionId = sessionId;
    document.getElementById("thread").innerHTML = "";
    document.getElementById("conversation").style.display = "none";
    document.getElementById("ask-status").innerHTML = "";

    // Highlight active session
    document.querySelectorAll(".session-item").forEach(el => {
      el.classList.toggle("active", el.dataset.sid === sessionId);
    });

    try {
      const resp = await fetch(`/sessions/${sessionId}`);
      const body = await resp.json();
      if (!resp.ok) return;
      for (const turn of body.data.turns) {
        const html = turn.answer_html || escHtml(turn.answer_markdown || "(no answer)");
        appendTurn(turn.question, html, turn.iteration_count, turn.tokens_input, turn.tokens_output, turn.status);
      }
    } catch { /* silently fail */ }
  }

  function startNewSession() {
    currentSessionId = null;
    document.getElementById("thread").innerHTML = "";
    document.getElementById("conversation").style.display = "none";
    document.getElementById("ask-status").innerHTML = "";
    document.querySelectorAll(".session-item").forEach(el => el.classList.remove("active"));
    document.getElementById("question").focus();
  }

  // ── conversation thread ───────────────────────────────────────────────────────

  function appendTurn(question, answerHtml, iterCount, tokensIn, tokensOut, status) {
    const thread = document.getElementById("thread");
    const div = document.createElement("div");
    div.className = "turn" + (status === "failed" ? " failed" : "");

    let meta = `${iterCount} iteration${iterCount !== 1 ? "s" : ""}`;
    if (tokensIn > 0 || tokensOut > 0) {
      meta += ` &nbsp;&middot;&nbsp; ${tokensIn.toLocaleString()} in / ${tokensOut.toLocaleString()} out tokens`;
    }

    div.innerHTML = `
      <div class="turn-q">Q: ${escHtml(question)}</div>
      <div class="answer-body">${answerHtml}</div>
      <div class="turn-meta">${meta}</div>`;
    thread.appendChild(div);
    document.getElementById("conversation").style.display = "block";
    div.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ── dataset change ────────────────────────────────────────────────────────────

  async function onDatasetChange() {
    currentDatasetId = document.getElementById("dataset-select").value || null;
    startNewSession();
    await loadSessionList();
  }

  // ── upload ────────────────────────────────────────────────────────────────────

  async function uploadFile() {
    const fileInput = document.getElementById("csv-file");
    const status = document.getElementById("upload-status");
    const info = document.getElementById("dataset-info");
    const btn = document.getElementById("upload-btn");

    if (!fileInput.files.length) {
      status.innerHTML = '<span class="error">Please select a file first.</span>';
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Uploading...';
    status.innerHTML = "";
    info.innerHTML = "";

    const fd = new FormData();
    fd.append("file", fileInput.files[0]);

    try {
      const resp = await fetch("/upload", { method: "POST", body: fd });
      const body = await resp.json();
      if (!resp.ok) {
        status.innerHTML = `<span class="error">Error: ${body.detail?.message || resp.statusText}</span>`;
      } else {
        const ds = body.data;
        status.innerHTML = `<span class="success">Uploaded successfully!</span>`;
        info.innerHTML = `<strong>${escHtml(ds.filename)}</strong> — ${ds.row_count} rows, ${ds.col_count} columns<br>
          <span class="col-list">Columns: ${ds.columns.map(escHtml).join(", ")}</span>`;
        const sel = document.getElementById("dataset-select");
        sel.add(new Option(`${ds.filename} (${ds.row_count} rows)`, ds.dataset_id, true, true), 1);
        currentDatasetId = ds.dataset_id;
        startNewSession();
        await loadSessionList();
      }
    } catch(e) {
      status.innerHTML = `<span class="error">Network error: ${escHtml(e.message)}</span>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Upload";
    }
  }

  // ── ask ───────────────────────────────────────────────────────────────────────

  async function askQuestion() {
    const questionEl = document.getElementById("question");
    const question = questionEl.value.trim();
    const status = document.getElementById("ask-status");
    const btn = document.getElementById("ask-btn");

    if (!currentDatasetId) { status.innerHTML = '<span class="error">Please select a dataset.</span>'; return; }
    if (!question)         { status.innerHTML = '<span class="error">Please enter a question.</span>'; return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Thinking...';
    status.innerHTML = "";

    try {
      const resp = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ dataset_id: currentDatasetId, question, session_id: currentSessionId }),
      });
      const body = await resp.json();
      if (!resp.ok) {
        status.innerHTML = `<span class="error">Error: ${body.detail?.message || resp.statusText}</span>`;
      } else {
        const r = body.data;
        currentSessionId = r.session_id;
        const html = r.answer_html || escHtml(r.answer_markdown || "(no answer)");
        appendTurn(question, html, r.iteration_count, r.tokens_input, r.tokens_output, r.status);
        questionEl.value = "";
        await loadSessionList();
      }
    } catch(e) {
      status.innerHTML = `<span class="error">Network error: ${escHtml(e.message)}</span>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Ask";
    }
  }

  // ── init ──────────────────────────────────────────────────────────────────────

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("question").addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) askQuestion();
    });
    const sel = document.getElementById("dataset-select");
    if (sel.value) { currentDatasetId = sel.value; loadSessionList(); }
  });
</script>
{% endblock %}
