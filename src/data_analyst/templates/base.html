<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="llm-model" content="{{ llm_model }}">
  <title>Data Analysis Agent</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8" defer></script>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; color: #1f2937; }

    /* ── Stub banner ──────────────────────────────────────────────────────── */
    .stub-banner {
      background: #fef3c7; border-bottom: 2px solid #f59e0b;
      padding: 8px 20px; text-align: center; font-size: 13px;
      font-weight: 500; color: #92400e;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    .site-header {
      background: #1e40af; color: white;
      padding: 0 24px;
      display: flex; align-items: stretch; justify-content: space-between;
      position: sticky; top: 0; z-index: 50; box-shadow: 0 1px 4px rgba(0,0,0,.2);
      min-height: 52px;
    }
    .site-header__left  { display: flex; align-items: center; gap: 20px; }
    .site-header__brand { display: flex; flex-direction: column; justify-content: center; }
    .site-header__brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .site-header__tabs { display: flex; gap: 4px; align-items: center; }
    .hdr-tab {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
      border-radius: 7px; color: rgba(255,255,255,.75);
      font-size: 14px; font-weight: 600;
      padding: 7px 18px; cursor: pointer; font-family: inherit;
      transition: background .15s, color .15s, border-color .15s;
      line-height: 1;
    }
    .hdr-tab:hover { background: rgba(255,255,255,.22); color: white; }
    .hdr-tab.active {
      background: white; color: #1e40af; border-color: white;
    }
    .site-header__actions  { display: flex; gap: 8px; align-items: center; }
    .header-btn {
      background: rgba(255,255,255,.15); color: white;
      border: 1px solid rgba(255,255,255,.3);
      padding: 6px 14px; border-radius: 6px; font-size: 13px;
      font-weight: 500; cursor: pointer; transition: background .15s;
    }
    .header-btn:hover { background: rgba(255,255,255,.25); }

    /* ── App shell ────────────────────────────────────────────────────────── */
    .app-shell {
      display: flex;
      height: calc(100vh - 52px); /* matches header height */
      overflow: hidden;
    }
    .app-shell.db-active .sidebar { display: none; }
    .app-shell.db-active .main { padding: 0; gap: 0; overflow: hidden; }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: white; border-right: 1px solid #e5e7eb;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar__sessions {
      flex: 1; overflow: hidden;
      display: flex; flex-direction: column;
      padding: 14px;
    }
    .sidebar__usage {
      flex-shrink: 0; padding: 14px;
      border-top: 1px solid #f3f4f6;
    }

    /* ── Main ─────────────────────────────────────────────────────────────── */
    .main {
      flex: 1; overflow-y: auto;
      padding: 18px; display: flex; flex-direction: column; gap: 14px;
    }

    /* ── Cards ────────────────────────────────────────────────────────────── */
    .card {
      background: white; border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 18px;
    }
    .card-row { display: flex; gap: 14px; align-items: flex-start; }
    .card-row > .card { flex: 1; min-width: 0; }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px; gap: 8px; flex-wrap: wrap;
    }
    .card-title { font-size: 14px; font-weight: 600; color: #1e3a5f; }

    /* ── Buttons ──────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 6px; font-size: 13px;
      font-weight: 600; font-family: inherit; border: none;
      cursor: pointer; transition: background .15s, opacity .15s; line-height: 1;
      white-space: nowrap;
    }
    .btn:disabled         { opacity: .5; cursor: not-allowed; }
    .btn-primary          { background: #1e40af; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d3a9e; }
    .btn-danger           { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled)  { background: #b91c1c; }
    .btn-ghost            { background: none; color: #6b7280; border: 1px solid #d1d5db; }
    .btn-ghost:hover:not(:disabled)   { background: #f9fafb; color: #374151; }
    .btn-ghost-danger     { background: none; color: #dc2626; border: 1px solid #fca5a5; }
    .btn-ghost-danger:hover:not(:disabled) { background: #fff5f5; }
    .btn-sm  { padding: 5px 11px; font-size: 12px; }
    .btn-xs  { padding: 3px 8px;  font-size: 11px; }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; padding: 2px 5px; font-size: 14px;
      transition: color .15s; line-height: 1;
    }
    .btn-icon:hover { color: #374151; }

    /* ── Forms ────────────────────────────────────────────────────────────── */
    .field-label {
      display: block; font-size: 11px; font-weight: 700;
      color: #6b7280; text-transform: uppercase; letter-spacing: .05em;
      margin-bottom: 5px;
    }
    textarea, input[type="text"] {
      width: 100%; padding: 8px 11px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 14px; font-family: inherit;
    }
    textarea:focus, input[type="text"]:focus {
      outline: 2px solid #3b82f6; outline-offset: 1px; border-color: transparent;
    }
    textarea { resize: vertical; }

    /* ── Spinner ──────────────────────────────────────────────────────────── */
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Messages ─────────────────────────────────────────────────────────── */
    .msg-error   { color: #dc2626; font-size: 13px; }
    .msg-success { color: #16a34a; font-size: 13px; }
    .empty-msg   { font-size: 12px; color: #9ca3af; font-style: italic; padding: 4px 0; }

    /* ── Context window bar (C29) ────────────────────────────────────────── */
    .cw-wrap { margin-top:10px; padding-top:10px; border-top:1px solid #f3f4f6; }
    .cw-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
    .cw-label { font-size:10px; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.07em; }
    .cw-count { font-size:11px; font-weight:600; color:#6b7280; font-variant-numeric:tabular-nums; }
    .cw-track { background:#f3f4f6; border-radius:4px; height:5px; overflow:hidden; }
    .cw-fill  { height:100%; border-radius:4px; background:#1e40af; transition:width .35s ease; }
    .cw-fill.warn   { background:#d97706; }
    .cw-fill.danger { background:#dc2626; }

    /* ── Prompt breakdown panel (C29) ────────────────────────────────────── */
    .bd-wrap  { background:#f1f5f9; border:1px solid #e2e8f0; border-radius:6px; padding:10px 12px; margin-bottom:12px; }
    .bd-title { font-size:10px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
    .bd-row   { display:flex; justify-content:space-between; padding:2px 0; }
    .bd-key   { font-size:12px; color:#6b7280; }
    .bd-val   { font-size:12px; font-weight:600; color:#374151; font-variant-numeric:tabular-nums; }
    .bd-total { margin-top:4px; padding-top:4px; border-top:1px solid #dde1e7; }
    .bd-total .bd-key { color:#374151; font-weight:600; }
    .bd-total .bd-val { color:#1e40af; }
    /* At-rest sidebar breakdown (C29): last query's component breakdown */
    .tu-breakdown { margin-top:10px; padding-top:10px; border-top:1px solid #f3f4f6; }
    .tu-breakdown .bd-wrap { margin-bottom:0; }

    /* ── Auto-notes badge (C30) ──────────────────────────────────────────── */
    .notes-gen-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; color:#6b7280; font-style:italic; }

    /* ── Token usage widget (light) ───────────────────────────────────────── */
    .tu-model-name {
      font-size: 11px; font-weight: 700; color: #1e40af;
      letter-spacing: .04em; text-transform: uppercase;
      padding-bottom: 8px; margin-bottom: 8px;
      border-bottom: 1px solid #f3f4f6;
    }
    .tu-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
    .tu-section { margin-bottom: 8px; }
    .tu-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #9ca3af; margin-bottom: 4px;
    }
    .tu-row { display: flex; justify-content: space-between; padding: 1px 0; }
    .tu-key  { font-size: 11px; color: #6b7280; }
    .tu-val  { font-size: 11px; font-weight: 600; color: #1f2937; font-variant-numeric: tabular-nums; }
    .tu-val.cost { color: #16a34a; }
    .tu-val.na   { color: #9ca3af; font-weight: 400; }
    .tu-storage  {
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid #f3f4f6;
      display: flex; gap: 4px; flex-wrap: wrap;
    }

    /* ── Modals ───────────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 300;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 10px;
      padding: 26px 28px 22px; width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.2); position: relative;
    }
    .modal--sm { max-width: 420px; }
    .modal--md { max-width: 540px; }
    .modal--lg { max-width: 640px; max-height: 90vh; overflow-y: auto; }
    .modal__title          { font-size: 16px; font-weight: 700; color: #1e3a5f; margin-bottom: 6px; }
    .modal__title--danger  { color: #b91c1c; }
    .modal__desc           { font-size: 13px; color: #6b7280; line-height: 1.55; margin-bottom: 14px; }
    .modal__actions        { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .modal__close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; font-size: 20px; line-height: 1;
      cursor: pointer; color: #9ca3af;
    }
    .modal__close:hover { color: #374151; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .app-shell { flex-direction: column; height: auto; overflow: visible; }
      .sidebar {
        width: 100%; flex-direction: row; flex-wrap: wrap;
        border-right: none; border-bottom: 1px solid #e5e7eb;
        max-height: none;
      }
      .sidebar__sessions {
        flex: 1; min-width: 180px;
        border-right: 1px solid #f3f4f6;
        max-height: 220px;
      }
      .sidebar__usage {
        min-width: 220px; border-top: none; flex: 1;
      }
      .main { overflow-y: visible; }
    }
    @media (max-width: 640px) {
      .site-header__brand p { display: none; }
      .main { padding: 12px; }
      .card-row { flex-direction: column; }
      .sidebar { flex-direction: column; }
      .sidebar__sessions { border-right: none; border-bottom: 1px solid #f3f4f6; max-height: 180px; }
      .tu-cols { grid-template-columns: 1fr; }
    }

    /* ── Screen-reader only ───────────────────────────────────────────────── */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <!-- ARIA live region for screen reader announcements -->
  <div id="aria-live" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  {% if llm_provider == "stub" %}
  <div class="stub-banner" role="status">
    ⚠ Running in stub mode — set <code>DATA_ANALYST_GEMINI_API_KEY</code> in your <code>.env</code> for real answers
  </div>
  {% endif %}

  <header class="site-header" id="site-header">
    <div class="site-header__left">
      <div class="site-header__brand">
        <h1>Data Analysis Agent</h1>
      </div>
      {% block header_center %}{% endblock %}
    </div>
    <div class="site-header__actions">
      <button class="header-btn" id="memory-open-btn" aria-haspopup="dialog" aria-controls="memory-modal"
              onclick="openModal('memory-modal');loadMemory()">
        Project notes
      </button>
    </div>
  </header>

  {% block content %}{% endblock %}

  <script>
    // ── Modal system ───────────────────────────────────────────────────────────
    function openModal(id) {
      const el = document.getElementById(id); if (!el) return;
      el.classList.add('open');
      const first = el.querySelector('button:not([aria-hidden]),input,textarea,select');
      if (first) setTimeout(() => first.focus(), 40);
    }
    function closeModal(id) {
      const el = document.getElementById(id); if (el) el.classList.remove('open');
    }
    // Escape key and backdrop click close any open modal
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.modal-overlay.open').forEach(o => o.classList.remove('open'));
    });
    document.addEventListener('click', e => {
      if (e.target.classList.contains('modal-overlay')) e.target.classList.remove('open');
    });

    // ── ARIA announce ──────────────────────────────────────────────────────────
    function announce(msg) {
      const el = document.getElementById('aria-live');
      if (!el) return;
      el.textContent = '';
      requestAnimationFrame(() => { el.textContent = msg; });
    }

    // ── Token usage widget ─────────────────────────────────────────────────────
    const _MODEL  = document.querySelector('meta[name="llm-model"]')?.content || '';

    // Prices per 1M tokens (USD). Sources: ai.google.dev/pricing (Jun 2026),
    // claude.com/platform/api, openrouter.ai/models. Tiered models use the
    // standard (≤200k / ≤128k) rate. More-specific patterns must come first.
    const _PRICING = [
      // ── Google Gemini ──────────────────────────────────────────────────────
      { pat: 'gemini-2.5-flash-lite',              in: 0.10,  out: 0.40  },
      { pat: 'gemini-2.5-flash',                   in: 0.30,  out: 2.50  },
      { pat: 'gemini-2.5-pro',                     in: 1.25,  out: 10.00 },
      { pat: 'gemini-2.0-flash',                   in: 0.10,  out: 0.40  },
      { pat: 'gemini-1.5-flash',                   in: 0.075, out: 0.30  },
      { pat: 'gemini-1.5-pro',                     in: 1.25,  out: 5.00  },
      { pat: 'gemini-3.5-flash',                   in: 1.50,  out: 9.00  },
      { pat: 'gemini-3.1-flash-lite',              in: 0.25,  out: 1.50  },
      { pat: 'gemini-3.1-pro',                     in: 2.00,  out: 12.00 },
      // ── Anthropic Claude 4.x (direct API) ─────────────────────────────────
      { pat: 'claude-opus-4',                      in: 5.00,  out: 25.00 },
      { pat: 'claude-sonnet-4',                    in: 3.00,  out: 15.00 },
      { pat: 'claude-haiku-4',                     in: 1.00,  out: 5.00  },
      // ── Anthropic Claude 3.x via OpenRouter ───────────────────────────────
      { pat: 'anthropic/claude-3-5-sonnet',        in: 3.00,  out: 15.00 },
      { pat: 'anthropic/claude-3-5-haiku',         in: 0.80,  out: 4.00  },
      { pat: 'anthropic/claude-3-opus',            in: 15.00, out: 75.00 },
      // ── OpenAI via OpenRouter ─────────────────────────────────────────────
      { pat: 'openai/gpt-4o-mini',                 in: 0.15,  out: 0.60  },
      { pat: 'openai/gpt-4o',                      in: 2.50,  out: 10.00 },
      { pat: 'openai/gpt-4-turbo',                 in: 10.00, out: 30.00 },
      // ── Meta Llama via OpenRouter ─────────────────────────────────────────
      { pat: 'meta-llama/llama-3.1-8b-instruct',  in: 0.02,  out: 0.03  },
      { pat: 'meta-llama/llama-3.1-70b-instruct', in: 0.40,  out: 0.40  },
      // ── Mistral via OpenRouter ────────────────────────────────────────────
      { pat: 'mistralai/mistral-7b-instruct',      in: 0.055, out: 0.055 },
      { pat: 'mistralai/mixtral-8x7b-instruct',    in: 0.24,  out: 0.24  },
    ];

    const _setText = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    const _price   = m => _PRICING.find(p => m.includes(p.pat)) || null;
    const _fmtCost = (ti, to, m) => {
      const p = _price(m); if (!p) return null;
      return '$' + ((ti / 1e6) * p.in + (to / 1e6) * p.out).toPrecision(4);
    };

    function tuAddRun(ti, to) {
      _setText('ses-ti', (ti||0).toLocaleString());
      _setText('ses-to', (to||0).toLocaleString());
      const cost = _fmtCost(ti||0, to||0, _MODEL);
      const el = document.getElementById('ses-cost');
      if (el) { el.textContent = cost || 'N/A'; el.className = 'tu-val ' + (cost ? 'cost' : 'na'); }
      tuRefreshDaily();
    }

    function _tuRenderDaily(d) {
      if (!d) { ['day-ti','day-to','day-qc','day-cost'].forEach(id => _setText(id, '—')); return; }
      _setText('day-ti', d.tokens_input.toLocaleString());
      _setText('day-to', d.tokens_output.toLocaleString());
      _setText('day-qc', d.query_count.toLocaleString());
      const cost = _fmtCost(d.tokens_input, d.tokens_output, d.model || _MODEL);
      const el = document.getElementById('day-cost');
      if (el) { el.textContent = cost || 'N/A'; el.className = 'tu-val ' + (cost ? 'cost' : 'na'); }
      const mn = document.getElementById('tu-model-name');
      if (mn) mn.textContent = d.model || _MODEL || '—';
    }

    async function tuRefreshDaily() {
      try {
        const d = (await (await fetch('/stats/daily')).json()).data;
        _tuRenderDaily(d);
        if (d && d.context_limit) {
          window._ctxLimit = d.context_limit;
          if (typeof window._updateCtxBar === 'function') window._updateCtxBar();
        }
      }
      catch { _tuRenderDaily(null); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      _setText('tu-model-name', _MODEL || '—');
      tuRefreshDaily();
    });
  </script>
</body>
</html>
