<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="llm-model" content="{{ llm_model }}">
  <title>Data Analysis Agent</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; }
    .stub-banner {
      background: #fef3c7; border-bottom: 2px solid #f59e0b;
      padding: 10px 20px; text-align: center; font-size: 14px; font-weight: 500;
    }
    header { background: #1e40af; color: white; padding: 16px 24px; }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 2px; }
    main { max-width: 1440px; margin: 24px auto; padding: 0 20px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 24px; margin-bottom: 24px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1e3a5f; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #555; }
    input[type=file], select, textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 14px; margin-bottom: 12px;
    }
    textarea { height: 80px; resize: vertical; }
    button {
      background: #1e40af; color: white; border: none;
      padding: 9px 20px; border-radius: 6px; font-size: 14px;
      cursor: pointer; font-weight: 500;
    }
    button:hover { background: #1d3a9e; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
    .success { color: #16a34a; font-size: 13px; margin-top: 8px; }
    .answer-box {
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: 6px; padding: 16px; margin-top: 16px;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .dataset-info { font-size: 13px; color: #555; margin-top: 8px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .col-list { font-size: 12px; color: #6b7280; margin-top: 4px; }

    /* ── C18: Token usage widget (inline dark card) ── */
    .tu-model { font-size: 12px; font-weight: 700; color: #93c5fd; margin-bottom: 10px; letter-spacing: .02em; }
    .tu-section { margin-bottom: 10px; }
    .tu-section:last-child { margin-bottom: 0; }
    .tu-section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #64748b; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.06); padding-bottom: 4px; }
    .tu-row { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 0; }
    .tu-key { color: #94a3b8; font-size: 11px; }
    .tu-val { color: #f1f5f9; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tu-val.cost { color: #86efac; }
    .tu-val.na  { color: #64748b; }
  </style>
</head>
<body>
  {% if llm_provider == "stub" %}
  <div class="stub-banner">
    ⚠ Running in stub mode — set <code>DATA_ANALYST_GEMINI_API_KEY</code> in your <code>.env</code> for real answers
  </div>
  {% endif %}

  <header>
    <h1>Data Analysis Agent</h1>
    <p>Upload a CSV and ask questions in plain English</p>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    window.llmProvider = "{{ llm_provider }}";

    // ── C18: Token usage widget ────────────────────────────────────────────────
    const _TU_KEY = 'tokenUsage';
    const _MODEL = document.querySelector('meta[name="llm-model"]')?.content || '';

    const _PRICING = [
      { pat: 'gemini-2.5-flash', in: 0.30,  out: 2.50  },
      { pat: 'gemini-2.5-pro',   in: 1.25,  out: 10.00 },
      { pat: 'gemini-2.0-flash', in: 0.10,  out: 0.40  },
      { pat: 'gemini-1.5-flash', in: 0.075, out: 0.30  },
      { pat: 'gemini-1.5-pro',   in: 1.25,  out: 5.00  },
    ];

    function _price(model) {
      return _PRICING.find(p => model.includes(p.pat)) || null;
    }

    function _fmtCost(ti, to, model) {
      const p = _price(model);
      if (!p) return null;
      const c = (ti / 1e6) * p.in + (to / 1e6) * p.out;
      // format to 6 sig figs with dollar sign
      return '$' + c.toPrecision(4);
    }

    function _getSession() {
      try {
        return JSON.parse(sessionStorage.getItem(_TU_KEY) || '{"ti":0,"to":0,"qc":0}');
      } catch { return {ti:0,to:0,qc:0}; }
    }

    function _saveSession(s) {
      try { sessionStorage.setItem(_TU_KEY, JSON.stringify(s)); } catch {}
    }

    function tuAddRun(ti, to) {
      const s = _getSession();
      s.ti += (ti||0); s.to += (to||0); s.qc += 1;
      _saveSession(s);
      _tuRenderSession(s);
      tuRefreshDaily();
    }

    function _tuRenderSession(s) {
      document.getElementById('ses-ti').textContent  = (s.ti||0).toLocaleString();
      document.getElementById('ses-to').textContent  = (s.to||0).toLocaleString();
      document.getElementById('ses-qc').textContent  = (s.qc||0).toLocaleString();
      const cost = _fmtCost(s.ti||0, s.to||0, _MODEL);
      const costEl = document.getElementById('ses-cost');
      costEl.textContent = cost || 'N/A';
      costEl.className = 'tu-val ' + (cost ? 'cost' : 'na');
    }

    function _tuRenderDaily(d) {
      if (!d) {
        ['day-ti','day-to','day-qc','day-cost'].forEach(id => { document.getElementById(id).textContent = '—'; });
        return;
      }
      document.getElementById('day-ti').textContent = d.tokens_input.toLocaleString();
      document.getElementById('day-to').textContent = d.tokens_output.toLocaleString();
      document.getElementById('day-qc').textContent = d.query_count.toLocaleString();
      const cost = _fmtCost(d.tokens_input, d.tokens_output, d.model || _MODEL);
      const costEl = document.getElementById('day-cost');
      costEl.textContent = cost || 'N/A';
      costEl.className = 'tu-val ' + (cost ? 'cost' : 'na');
      const mn = document.getElementById('tu-model-name');
      if (mn) mn.textContent = d.model || _MODEL;
    }

    async function tuRefreshDaily() {
      try {
        const body = await (await fetch('/stats/daily')).json();
        _tuRenderDaily(body.data);
      } catch {
        _tuRenderDaily(null);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const mn = document.getElementById('tu-model-name');
      if (mn) mn.textContent = _MODEL || '—';
      _tuRenderSession(_getSession());
      tuRefreshDaily();
    });
  </script>
</body>
</html>
