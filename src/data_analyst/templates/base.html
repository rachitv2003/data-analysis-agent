<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Analysis Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; color: #333; }
    .stub-banner {
      background: #fef3c7; border-bottom: 2px solid #f59e0b;
      padding: 10px 20px; text-align: center; font-size: 14px; font-weight: 500;
    }
    header { background: #1e40af; color: white; padding: 16px 24px; }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 2px; }
    main { max-width: 860px; margin: 32px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 24px; margin-bottom: 24px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1e3a5f; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #555; }
    input[type=file], select, textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #d1d5db;
      border-radius: 6px; font-size: 14px; margin-bottom: 12px;
    }
    textarea { height: 80px; resize: vertical; }
    button {
      background: #1e40af; color: white; border: none;
      padding: 9px 20px; border-radius: 6px; font-size: 14px;
      cursor: pointer; font-weight: 500;
    }
    button:hover { background: #1d3a9e; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
    .success { color: #16a34a; font-size: 13px; margin-top: 8px; }
    .answer-box {
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: 6px; padding: 16px; margin-top: 16px;
      font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .dataset-info { font-size: 13px; color: #555; margin-top: 8px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .col-list { font-size: 12px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  {% if llm_provider == "stub" %}
  <div class="stub-banner">
    ⚠ Running in stub mode — set <code>DATA_ANALYST_GEMINI_API_KEY</code> in your <code>.env</code> for real answers
  </div>
  {% endif %}

  <header>
    <h1>Data Analysis Agent</h1>
    <p>Upload a CSV and ask questions in plain English</p>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script>
    window.llmProvider = "{{ llm_provider }}";
  </script>
</body>
</html>
